type: blog
displayName: Blog
displayNamePlural: Blog Posts
icon: article
color: '#059669'
modes:
  inline: true
  fullDocument: true
idPrefix: blog
idFormat: ulid
fields:
  - name: title
    type: string
    required: true
    displayInline: true
  - name: status
    type: select
    required: false
    default: to-do
    displayInline: true
    options:
      - value: to-do
        label: To Do
      - value: drafting
        label: Drafting
      - value: in-review
        label: In Review
      - value: published
        label: Published
      - value: archived
        label: Archived
  - name: priority
    type: select
    required: false
    default: medium
    displayInline: true
    options:
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High
  - name: owner
    type: user
    required: false
    displayInline: true
  - name: tags
    type: array
    required: false
    displayInline: false
    itemType: string
  - name: description
    type: text
    required: false
    displayInline: false
  - name: created
    type: string
    required: false
    displayInline: false
  - name: updated
    type: string
    required: false
    displayInline: false
inlineTemplate: '{icon} {title} {status} {priority}'
sync:
  mode: local
  scope: project
